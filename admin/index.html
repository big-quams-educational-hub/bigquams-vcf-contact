<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusConnect NG – Admin VCF Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--blue:#007BFF;
--green:#28A745;
--gray:#6c757d;
--light:#f8f9fa;
--border:#ced4da;
--shadow:rgba(0,0,0,.15);
}
body{
margin:0;
font-family:Segoe UI,Roboto,sans-serif;
background:var(--light);
display:flex;
justify-content:center;
}
.container{
width:95%;
max-width:900px;
background:#fff;
margin:30px 0;
padding:30px;
border-radius:12px;
box-shadow:0 8px 25px var(--shadow);
}
h1{
text-align:center;
color:var(--blue);
margin-bottom:10px;
}
p.note{
text-align:center;
color:var(--gray);
margin-bottom:25px;
}
.actions{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:25px;
}
button{
border:none;
padding:14px 25px;
border-radius:8px;
font-weight:700;
cursor:pointer;
color:#fff;
font-size:1rem;
}
.btn-new{background:var(--green)}
.btn-all{background:var(--blue)}

table{
width:100%;
border-collapse:collapse;
}
th,td{
border:1px solid var(--border);
padding:10px;
font-size:.9rem;
}
th{background:#f1f3f5}
.new{
background:#e6fffa;
font-weight:600;
}
.badge{
background:var(--green);
color:#fff;
padding:3px 8px;
border-radius:10px;
font-size:.75rem;
}
.footer{
text-align:center;
margin-top:20px;
font-size:.85rem;
color:#666;
}
</style>
</head>

<body>

<div class="container">
<h1>Admin VCF Download Panel</h1>
<p class="note">This panel is for downloading and managing contact VCF files only.</p>

<div class="actions">
<button class="btn-new" onclick="downloadNew()">⬇ Download NEW Contacts</button>
<button class="btn-all" onclick="downloadAll()">⬇ Download ALL Contacts</button>
</div>

<div id="table-area">Loading contacts…</div>

<div class="footer">CampusConnect NG • Admin Only</div>
</div>

<script>
const API="https://sheetdb.io/api/v1/lcqbyo961rmzf";
const TRACK_ID=2;
const TRACK_COL="admin_last_download";

let contacts=[];
let lastDownload=new Date("2000-01-01");

function normalize(phone){
let n=phone.replace(/\D/g,"");
if(n.startsWith("0")) n=n.slice(1);
if(!n.startsWith("234")) n="234"+n;
return "+"+n;
}

function vcf(c){
return `BEGIN:VCARD
VERSION:3.0
FN:${c.name}
TEL:${normalize(c.phone)}
NOTE:${c.state || ""}
END:VCARD
`;
}

async function load(){
const res=await fetch(API);
const data=await res.json();

const track=data.find(r=>r.id==TRACK_ID);
if(track && track[TRACK_COL]){
lastDownload=new Date(track[TRACK_COL]);
}

contacts=data.filter(r=>r.id!=TRACK_ID);
render();
}
load();

function render(){
document.getElementById("table-area").innerHTML=`
<table>
<tr>
<th>Status</th>
<th>Name</th>
<th>State</th>
<th>Phone</th>
<th>Joined</th>
</tr>
${contacts.map(c=>{
const isNew=new Date(c.joindate)>lastDownload;
return `
<tr class="${isNew?'new':''}">
<td>${isNew?'<span class="badge">NEW</span>':'—'}</td>
<td>${c.name}</td>
<td>${c.state}</td>
<td>${c.phone}</td>
<td>${new Date(c.joindate).toLocaleString()}</td>
</tr>`;
}).join("")}
</table>`;
}

function download(content,filename){
const blob=new Blob([content],{type:"text/vcard"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=filename;
a.click();
URL.revokeObjectURL(a.href);
}

async function downloadNew(){
const fresh=contacts.filter(c=>new Date(c.joindate)>lastDownload);
if(!fresh.length){
alert("No new contacts since last download.");
return;
}
download(fresh.map(vcf).join(""),"CampusConnect_NEW.vcf");

await fetch(`${API}/id/${TRACK_ID}`,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({data:{[TRACK_COL]:new Date().toISOString()}})
});

alert(`${fresh.length} new contacts downloaded.`);
location.reload();
}

function downloadAll(){
if(!contacts.length){
alert("No contacts available.");
return;
}
download(contacts.map(vcf).join(""),"CampusConnect_ALL.vcf");
}
</script>

</body>
</html>
